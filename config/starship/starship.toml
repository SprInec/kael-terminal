disabled = false
time_format = '%H:%M:%S'
format = '[$time]($style) '
style = 'bold fg:#72BCCB'

[git_status]
format = '$all_status$ahead_behind'
ahead = '⇡ ${count}'
behind = '⇣ ${count}'
diverged = '⇕⇡ ${ahead_count}⇣ ${behind_count}'

# Only show a hosting provider when the current branch has a tracking remote.
[custom.git_host]
command = 'python3 "${XDG_CONFIG_HOME:-$HOME/.config}/starship/git-host.py"'
when = true
require_repo = true
shell = ['sh']
format = '([$output]($style)  )'
style = 'bold red'
description = '当前分支跟踪远端的 GitHub / GitLab 图标'
