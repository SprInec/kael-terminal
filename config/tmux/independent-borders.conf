# Settings for the independent-border tmux builds.
source-file @@TMUX_BASE@@
set -g pane-border-type separate
set -gq pane-border-bottom on
%if #{!=:#{TABBY_CONFIG_DIRECTORY},}
set -gq pane-border-compact on
%endif
set -g pane-border-indicators off
# tmux flips the reverse bit on marked border cells. Cancel it there
# and explicitly draw the top status border without it.
set -g pane-border-style 'fg=#{?#{&&:#{pane_marked},#{window_marked_flag}},#eab54f,colour238},bg=default,#{?#{&&:#{pane_marked},#{window_marked_flag}},reverse,noreverse}'
set -g pane-active-border-style 'fg=#{?#{E:@pane-remote},#{@pane-remote-colour},#{?#{&&:#{pane_marked},#{window_marked_flag}},#eab54f,#{?pane_in_mode,yellow,#{?synchronize-panes,red,#b1e969}}}},bg=default,#{?#{&&:#{pane_marked},#{window_marked_flag}},reverse,noreverse}'
set -g pane-border-format '#[bg=default,noreverse,fg=#{?#{&&:#{pane_active},#{E:@pane-remote}},#{@pane-remote-colour},#{?#{&&:#{pane_marked},#{window_marked_flag}},#eab54f,#{?pane_active,green,colour250}}},nobold]  #{pane_index}  #[#{?pane_active,bold,nobold}]#{?pane_title,#{=/40/…:pane_title},#{pane_current_command}}  #{?#{&&:#{pane_marked},#{window_marked_flag}},#[default#,noreverse]#{R:─,#{pane_width}},}#[default]'

# Use the pane's existing border as a clockwise transfer progress bar.
set -gw @pane-border-progress on

# Native clockwise focus glow, 20 fps; one lap every 4000 ms.
# Window options: use set -gw to set the defaults for all windows.
set -gw @pane-border-glow on
set -gw @pane-border-glow-period 4000

# The marked title row is drawn at a fixed colour to avoid reverse video.
# Pause the glow while its pane is focused, then restore its window setting.
set -g @pane-mark-glow-sync '#{S:#{W:#{?pane_marked,#{?#{||:#{==:#{@pane-border-glow},on},#{==:#{@pane-border-glow},1}},set -w -t #{window_id} @pane-border-glow mark-focus:#{O/w:#{?#{==:#{option_name},@pane-border-glow},#{option_value},}} ; ,},#{?#{==:#{@pane-border-glow},mark-focus:},set -wqu -t #{window_id} @pane-border-glow ; ,#{?#{m:mark-focus:*,#{@pane-border-glow}},set -w -t #{window_id} @pane-border-glow #{?#{==:#{@pane-border-glow},mark-focus:1},1,on} ; ,}}}}}'
set-hook -g marked-pane-changed[90] { if-shell -F '#{E:@pane-mark-glow-sync}' { run-shell -C '#{E:@pane-mark-glow-sync}' } }
set-hook -gw window-pane-changed[90] { if-shell -F '#{E:@pane-mark-glow-sync}' { run-shell -C '#{E:@pane-mark-glow-sync}' } }
set-hook -gw window-layout-changed[90] { if-shell -F '#{E:@pane-mark-glow-sync}' { run-shell -C '#{E:@pane-mark-glow-sync}' } }
if-shell -F '#{E:@pane-mark-glow-sync}' { run-shell -C '#{E:@pane-mark-glow-sync}' }

# Restore the default close shortcut when reloading an older configuration.
bind-key -N 'Kill the active pane' x { confirm-before -p 'kill-pane #P? (y/n)' kill-pane }

# Toggle the active pane using the same commands as the right-click menu.
bind-key -N 'Toggle pane between floating and tiled' F {
    if-shell -F '#{pane_floating_flag}' { join-pane } { break-pane -W }
}

# Use tmux's native pane menu even when the program has enabled mouse reporting.
# Some terminals report the press without a matching right-button release.
# Place submenus beside the first menu so the selecting click releases outside them.
bind-key -T root MouseDown3Pane {
    display-menu -O -T '#[align=centre]#{pane_index} (#{pane_id})' -t = -x M -y M \
        '#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}' '<' { send-keys -X history-top } \
        '#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}' '>' { send-keys -X history-bottom } \
        '' \
        '#{?#{==:#{pane_mode},copy-mode},#{?copy_line_numbers,Hide Line Numbers,Show Line Numbers},}' L { send-keys -X line-numbers-toggle } \
        '#{?#{==:#{pane_mode},copy-mode},Edit,}' e { if-shell -F '#{selection_present}' { send-keys -X open-selection } { send-keys -X open-output } } \
        '#{?#{==:#{pane_mode},copy-mode},#{?refresh_active,Refresh Off,Refresh On},}' r { send-keys -X refresh-toggle } \
        '' \
        '#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}' p { paste-buffer } \
        '' \
        '#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}' C-r { if-shell -F '#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}' 'copy-mode -t='; send-keys -X -t = search-backward -- "#{q:mouse_word}" } \
        '#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}' C-y { copy-mode -q; send-keys -l "#{q:mouse_word}" } \
        '#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}' c { copy-mode -q; set-buffer "#{q:mouse_word}" } \
        '#{?mouse_line,Copy Line,}' l { copy-mode -q; set-buffer "#{q:mouse_line}" } \
        '' \
        '#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}' C-h { copy-mode -q; send-keys -l "#{q:mouse_hyperlink}" } \
        '#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}' h { copy-mode -q; set-buffer "#{q:mouse_hyperlink}" } \
        '' \
        '#{?#{#{pane_floating_flag}},Move,}' '' {
            display-menu -O -T '#[align=centre]Move' -x '##{?##{e|>=:##{popup_last_x},##{popup_width}},##{e|-:##{popup_last_x},##{popup_width}},##{window_width}}' -y L \
                Centre c { move-pane -P centre } \
                '' \
                'Top Left' 1 { move-pane -P top-left } \
                'Top Right' 2 { move-pane -P top-right } \
                'Bottom Left' 3 { move-pane -P bottom-left } \
                'Bottom Right' 4 { move-pane -P bottom-right } \
                '' \
                Top t { move-pane -P top-centre } \
                Bottom b { move-pane -P bottom-centre } \
                Left l { move-pane -P centre-left } \
                Right r { move-pane -P centre-right }
        } \
        '#{?#{#{pane_floating_flag}},Move & Resize,}' '' {
            display-menu -O -T '#[align=centre]Move & Resize' -x '##{?##{e|>=:##{popup_last_x},##{popup_width}},##{e|-:##{popup_last_x},##{popup_width}},##{window_width}}' -y L \
                Fill 0 { resize-pane -x '100%' -y '100%'; move-pane -P top-left } \
                '' \
                'Top Left' 1 { resize-pane -x '50%' -y '50%'; move-pane -P top-left } \
                'Top Right' 2 { resize-pane -x '50%' -y '50%'; move-pane -P top-right } \
                'Bottom Left' 3 { resize-pane -x '50%' -y '50%'; move-pane -P bottom-left } \
                'Bottom Right' 4 { resize-pane -x '50%' -y '50%'; move-pane -P bottom-right } \
                '' \
                Top t { resize-pane -x '100%' -y '50%'; move-pane -P top-centre } \
                Bottom b { resize-pane -x '100%' -y '50%'; move-pane -P bottom-centre } \
                Left l { resize-pane -x '50%' -y '100%'; move-pane -P centre-left } \
                Right r { resize-pane -x '50%' -y '100%'; move-pane -P centre-right }
        } \
        '#{?#{#{pane_floating_flag}},Tile,}' t { join-pane } \
        '#{?#{!:#{pane_floating_flag}},Float,}' f { break-pane -W } \
        '#{?#{!:#{pane_floating_flag}},Horizontal Split,}' h { split-window -h } \
        '#{?#{!:#{pane_floating_flag}},Vertical Split,}' v { split-window -v } \
        '' \
        '#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}' u { swap-pane -U } \
        '#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}' d { swap-pane -D } \
        '#{?pane_marked_set,,-}Swap Marked' s { swap-pane } \
        '' \
        Kill X { kill-pane } \
        Respawn R { respawn-pane -k } \
        '#{?pane_marked,Unmark,Mark}' m { select-pane -m } \
        '#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}' z { resize-pane -Z }
}

# Consume an early release if it reaches the root table before the menu opens.
bind-key -T root MouseUp3Pane { }
