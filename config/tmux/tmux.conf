

# BEGIN managed-tmux-status
source-file @@TMUX_STATUS@@
set -g default-shell @@ZSH@@
set -g pane-border-status top
set -g mouse on
# Expand the pane identity before starting the format job so its cache is per pane.
set -g @pane-remote-probe '##(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" --remote-terminal #{pane_pid} #{q:pane_tty} #{q:pane_current_command})'
set -g @pane-remote '#{?#{m/r:^(ssh|adb|mosh-client|dbclient)$,#{pane_current_command}},#{==:1,#{E:#{E:@pane-remote-probe}}},0}'
set -g @pane-remote-colour '#ffe1ea'
set -g @pane-mark-colour '#ff9f43'
set -g @pane-training-colour '#b69cff'
set -g @pane-training-probe '##(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" --training-terminal #{pane_pid})'
set -g @pane-training '#{?pane_dead,0,#{@kael-training-colour},1,#{m/r:^(bash|zsh|dash|sh|fish|conda|torchrun|deepspeed|accelerate|python[0-9.]*)$,#{pane_current_command}},#{==:1,#{E:#{E:@pane-training-probe}}},0}'
set -g @pane-focus-state '#{?#{E:@pane-remote},remote,local}'
set -g @pane-focus-colour '#{?#{==:#{E:@pane-focus-state},remote},#{@pane-remote-colour},#{==:#{E:@pane-focus-state},marked},#{@pane-mark-colour},#{E:@pane-training},#{?#{@kael-training-colour},#{@kael-training-colour},#{@pane-training-colour}},#{==:#{E:@pane-focus-state},copy},#ebd99c,#{==:#{E:@pane-focus-state},sync},#ff615a,#b1e969}'
set -g pane-border-style 'fg=colour238,bg=default'
set -g pane-active-border-style 'fg=#{E:@pane-focus-colour},bg=default'
set -g pane-border-format '#[bg=default,fg=#{?pane_active,#{E:@pane-focus-colour},colour250},nobold]  #{pane_index}  #[#{?pane_active,bold,nobold}]#{?pane_title,#{=/40/…:pane_title},#{pane_current_command}}  #[default]'
# END managed-tmux-status

# Forward pane and terminal focus changes to applications such as Dooit.
set -s focus-events on

# Match Tabby: explicitly keep the underline cursor blinking.
set -gw cursor-style blinking-underline
set -gq prompt-cursor-style blinking-underline
# Show the cursor without resetting its independently selected blink mode.
set -as terminal-overrides ',xterm*:cnorm=\E[?25h'
