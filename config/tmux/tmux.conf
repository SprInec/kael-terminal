

# BEGIN managed-tmux-status
source-file @@TMUX_STATUS@@
set -g default-shell @@ZSH@@
set -g pane-border-status top
set -g mouse on
# Expand the pane identity before starting the format job so its cache is per pane.
set -g @pane-remote-probe '##(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" --remote-terminal #{pane_pid} #{q:pane_tty} #{q:pane_current_command})'
set -g @pane-remote '#{?#{m/r:^(ssh|adb|mosh-client|dbclient)$,#{pane_current_command}},#{==:1,#{E:#{E:@pane-remote-probe}}},0}'
set -g @pane-remote-colour '#ffc0cb'
set -g pane-border-style 'fg=colour238,bg=default'
set -g pane-active-border-style 'fg=#{?#{E:@pane-remote},#{@pane-remote-colour},green},bg=default'
set -g pane-border-format '#[bg=default,fg=#{?pane_active,#{?#{E:@pane-remote},#{@pane-remote-colour},green},colour250},nobold]  #{pane_index}  #[#{?pane_active,bold,nobold}]#{?pane_title,#{=/40/…:pane_title},#{pane_current_command}}  #[default]'
# END managed-tmux-status

# Forward pane and terminal focus changes to applications such as Dooit.
set -s focus-events on

# Match Tabby: explicitly keep the underline cursor blinking.
set -gw cursor-style blinking-underline
set -gq prompt-cursor-style blinking-underline
# Show the cursor without resetting its independently selected blink mode.
set -as terminal-overrides ',xterm*:cnorm=\E[?25h'
