# Managed tmux status: green accents matched to the active pane border.
# Tabby Default ANSI green: #b1e969; neutral dark-green surfaces.
# Git: ✓ clean, ● changed/untracked, ↑N/↓N ahead/behind, ? unknown.
# Uses the installed SauceCodePro Nerd Font; resource colours are visual hints.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style 'bg=#171b16,fg=#929e85'
set -g status-left-style default
set -g status-right-style default
set -g status-left-length 32
set -g status-right-length 1000
set -g status-justify left
# Use the active pane's foreground job. The logo glyphs live in Starship Prompt Icons.
set -g @status-cli '#(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" --foreground-cli #{pane_pid} #{q:pane_current_command})'
set -g @status-cli-icon '#{?#{==:#{pane_pid}:#{pane_current_command}:codex,#{E:@status-cli}}, 󸂀 ,#{?#{==:#{pane_pid}:#{pane_current_command}:claude,#{E:@status-cli}}, 󸂁 ,}}'
set -g status-left '#[fg=#b1e969,bg=#171b16]#[fg=#17210f,bg=#b1e969,bold] #{?#{<:client_width,70},#{=6:session_name},#{=12:session_name}} #[fg=#b1e969,bg=#171b16,nobold] #[default]#[fg=#3b452c,bg=#171b16,nobold]#{?client_prefix,,}#[fg=#c1d88a,bg=#3b452c,nobold]#{?client_prefix, ,}#[fg=#e4ead7,bg=#3b452c,bold]#{?client_prefix,PFX,}#[fg=#3b452c,bg=#171b16,nobold]#{?client_prefix, ,}#[default]'
set -g status-right '#(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" #{q:pane_current_path} #{client_width} / #{q:session_name})'
setw -g window-status-format '#[fg=#7f8d72] #I #[fg=#929e85]#{=18:window_name}#[fg=#d7c183]#{window_flags} #[default]'
setw -g window-status-current-format '#[fg=#293322,bg=#171b16]#[fg=#b1e969,bg=#293322,bold]#I #[fg=#dce5d3]#{=18:window_name}#{E:@status-cli-icon}#{?window_zoomed_flag, #[fg=#a5bb8b],}#{?pane_in_mode, #[fg=#d7c183],}#{?#{||:#{window_zoomed_flag},#{pane_in_mode}}, ,}#[fg=#293322,bg=#171b16,nobold]#[default]'
setw -g window-status-style 'bg=#171b16,fg=#929e85,noreverse'
setw -g window-status-current-style 'bg=#171b16,fg=#dce5d3,noreverse'
setw -g window-status-activity-style 'bg=#171b16,fg=#d7c183,noreverse'
setw -g window-status-bell-style 'bg=#171b16,fg=#e6a091,noreverse,bold'
setw -g window-status-separator ' '
set -gu status-format
