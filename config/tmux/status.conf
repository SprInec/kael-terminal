# Managed tmux status: use the active pane border's accent and matching backgrounds.
# Git: ✓ clean, ● changed/untracked, ↑N/↓N ahead/behind, ? unknown.
# Uses the installed SauceCodePro Nerd Font; resource colours are visual hints.
set -g @status-default-palette '#{?#{==:#{E:@pane-focus-state},remote},#21191e #392630 #503542,#{==:#{E:@pane-focus-state},marked},#211c14 #372b1c #503d25,#{==:#{E:@pane-focus-state},copy},#201e16 #35301f #49432d,#{==:#{E:@pane-focus-state},sync},#231918 #3a2422 #502d2a,#171b16 #293322 #3b452c} #17210f'
# Read the inherited pane style, honoring the last foreground after any style reset.
set -g @status-border-rgb '#{c:#{s~^(.*[ ,])?default([ ,]+|$)~~i;s~^(.*[ ,])?fg=([^ ,]+)([ ,].*)?$~\2~i;E:pane-active-border-style}}'
set -g @status-accent '#{?#{E:@status-border-rgb},###{E:@status-border-rgb},#{E:@pane-focus-colour}}'
# Expand the RGB before starting the job so panes with different colours have independent caches.
set -g @status-palette-probe '##(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" --accent-palette #{q:#{E:@status-border-rgb}})'
set -g @status-custom-palette '#{?#{!=:#{E:@status-accent},#{E:@pane-focus-colour}},#{E:#{E:@status-palette-probe}},}'
set -g @status-palette '#{?#{m/r:^#.*,#{E:@status-custom-palette}},#{E:@status-custom-palette},#{E:@status-default-palette}}'
# Palette columns are the bar, window and prefix backgrounds, then the session label foreground.
set -g @status-bg '#{s| .*||;E:@status-palette}'
set -g @status-window-bg '#{s|^[^ ]+ ||;s| .*||;E:@status-palette}'
set -g @status-prefix-bg '#{s|^[^ ]+ [^ ]+ ||;s| .*||;E:@status-palette}'
set -g @status-session-fg '#{s|^.* ||;E:@status-palette}'
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style 'bg=#{E:@status-bg},fg=#929e85'
set -g status-left-style default
set -g status-right-style default
set -g status-left-length 32
set -g status-right-length 1000
set -g status-justify left
# Use the active pane's foreground job. The logo glyphs live in Starship Prompt Icons.
set -g @status-cli '#(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" --foreground-cli #{pane_pid} #{q:pane_current_command})'
set -g @status-cli-icon '#{?#{==:#{pane_pid}:#{pane_current_command}:codex,#{E:@status-cli}}, 󸂀,#{?#{==:#{pane_pid}:#{pane_current_command}:claude,#{E:@status-cli}}, 󸂁,}}'
# Join the session and prefix to the background of the first window in the list.
set -g @status-first-window-bg '#{?window_start_flag,#{E:@status-window-bg},#{E:@status-bg}}'
set -g @status-prefix '#[fg=#{E:@status-accent},bg=#{E:@status-prefix-bg},nobold]  #[fg=#e4ead7,bold]PFX #[fg=#{E:@status-prefix-bg},bg=#{E:@status-first-window-bg},nobold]'
set -g status-left '#[fg=#{E:@status-session-fg},bg=#{E:@status-accent},bold]   #{?#{<:client_width,70},#{=6:session_name},#{=12:session_name}} #[fg=#{E:@status-accent},bg=#{?client_prefix,#{E:@status-prefix-bg},#{E:@status-first-window-bg}},nobold]#{?client_prefix,#{E:@status-prefix},}#[default]'
# Resolve the accent before starting the job. Let the job expand the data arguments normally.
set -g @status-right-job '##(python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/status.py" ##{q:pane_current_path} ##{client_width} / ##{q:session_name} #{c:#{E:@status-accent}})'
set -g status-right '#{E:#{E:@status-right-job}}'
setw -g window-status-format '#[fg=#7f8d72] #I #[fg=#929e85]#{=18:window_name}#[fg=#d7c183]#{window_flags} #[fg=#48533e,nobold]#{?#{||:#{window_end_flag},#{window_before_active}},,}#[default]'
setw -g window-status-current-format '#[fg=#{E:@status-bg},bg=#{E:@status-window-bg},nobold]#{?window_start_flag,,}#[fg=#{E:@status-accent},bold] #I #[fg=#dce5d3]#{=18:window_name}#{E:@status-cli-icon}#{?window_zoomed_flag, #[fg=#a5bb8b],}#{?pane_in_mode, #[fg=#d7c183],} #[fg=#{E:@status-window-bg},bg=#{E:@status-bg},nobold]#[default]'
setw -g window-status-style 'fg=#929e85,noreverse'
setw -g window-status-current-style 'fg=#dce5d3,noreverse'
setw -g window-status-activity-style 'fg=#d7c183,noreverse'
setw -g window-status-bell-style 'fg=#e6a091,noreverse,bold'
setw -g window-status-separator ''
set -gu status-format
