model = "gpt-6.2-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 9000000
model_reasoning_effort = "xhigh"
service_tier = "default"

[features]
tui_extensions_statusline = true
js_repl = false

[tui]
theme = "ada"
status_line = ["model-with-reasoning", "weekly-limit", "context-remaining"]
status_line_use_colors = true
sidebar_width_percent = 40
status_line_provider = { server = "ada-usage-statusline", tool = "statusline" }

[mcp_servers.ada-usage-statusline]
command = @@ADA_PYTHON@@
args = ["-u", @@ADA_SCRIPT@@]
