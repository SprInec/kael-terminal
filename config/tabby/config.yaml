  profile: local:custom:kael-zsh
  paletteGenerate: true
  paletteHarmonious: true
  rightClick: 'off'
  cursor: underline
  font: Kael Starship Prompt Icons,Liberation Mono
  sixel: true
appearance:
  colorSchemeMode: auto
  css: |
    terminaltab > .content {
      margin: 6px 6px 4px !important;
      align-content: end;
    }
    terminaltab > .content:has(.xterm.kael-compact-frames) {
      box-sizing: content-box;
      margin-block: -1px !important;
      padding-block-start: 6px;
    }
enableAnalytics: false
enableWelcomeTab: false
pluginBlacklist:
- quick-cmds
- sftp-plus
profileDefaults:
  ssh:
    disableDynamicTitle: true
highlightPlugin:
  advanced: {}
  highlightProfiles:
  - id: 60606be0-c0ff-42bc-bf77-de8a2435447f
    name: Default
    keywords:
    - text: ERROR
      enabled: true
      background: true
      backgroundColor: '1'
    - text: WARN
      enabled: true
      background: true
      backgroundColor: '3'
    - text: INFO
      enabled: true
      background: true
      backgroundColor: '6'
    - text: 错误
      enabled: true
      background: true
      backgroundColor: '1'
    - text: 警告
      enabled: true
      background: true
      backgroundColor: '3'
    - text: 信息
      enabled: true
      background: true
      backgroundColor: '6'
  replaceProfiles:
  - id: 986666dd-dac9-4c7a-a295-9b4aff66abdd
    name: Default
    patterns:
    - enabled: true
      search: ERROR
      replace: 出错啦
    - enabled: true
      search: WARN
      replace: 警告警告
